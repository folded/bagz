name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macosx_deployment_target must match the runner's OS version,
          # otherwise delocate rejects the wheel because Homebrew libs are
          # built targeting the host OS (e.g. macos-14 ships 14.0-only libs).
          - os: macos-13
            arch: x86_64
            macosx_deployment_target: "13.0"
          - os: macos-14
            arch: arm64
            macosx_deployment_target: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from tags.
          fetch-depth: 0

      # pyproject.toml pins build-frontend = "build[uv]". On Linux, uv lives
      # inside the manylinux container; on macOS cibuildwheel runs natively
      # and needs uv on PATH.
      - uses: astral-sh/setup-uv@v6

      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  release:
    name: Publish release
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

  publish_index:
    name: Publish package index
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install dumb-pypi

      - name: Collect wheel URLs from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPO}/releases?per_page=100" \
            | jq -c '.[]?.assets[]? | select(.name | endswith(".whl")) | {filename: .name, url: .browser_download_url}' \
            > packages.json
          test -s packages.json

      - name: Generate simple index
        run: |
          dumb-pypi \
            --package-list-json packages.json \
            --output-dir _site \
            --packages-url "https://github.com/${{ github.repository }}/releases/download"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
